services:
  # Servicio Web Principal (Node.js Full-Stack + Express + Vite Frontend)
  - type: web
    name: neuraforge-botcaza-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  # Servicio Worker Python Opcional (usando requirements.txt)
