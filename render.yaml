services:
  # Servicio Web Principal (Node.js Full-Stack + Express + Vite Frontend)
  # Selecciona 'Node' en Render si creas el servicio manualmente
  - type: web
    name: neuraforge-botcaza-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  # Servicio Opcional Python Web / API (con Gunicorn + Flask / FastAPI)
  # Si en Render elegiste 'Python 3', este es el comando que gunicorn necesita:
  - type: web
    name: neuraforge-botcaza-python-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 3000

